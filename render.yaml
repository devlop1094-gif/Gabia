databases:
  - name: euana-db
    plan: free
    databaseName: euana
    user: euana

services:
  - type: web
    name: euana
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: euana-db
          property: connectionString
